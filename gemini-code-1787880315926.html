<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Beauty & Styling - Book Consultation</title>
  <style>
    :root {
      --primary-color: #00a8cc;
      --primary-hover: #008cae;
      --bg-color: #e6f7ff;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --input-bg: #eef6fc;
      --border-color: #d1e5f0;
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .booking-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px var(--shadow-color);
    }

    .header-text {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-text h3 {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--primary-color);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .header-text h1 {
      font-size: 1.8rem;
      color: #1a5b6e;
      font-family: Georgia, serif;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 168, 204, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease-in-out;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <div class="booking-card">
    <div class="header-text">
      <h3>Aura Beauty & Styling</h3>
      <h1>Book a Consultation</h1>
    </div>

    <form action="#" method="POST">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+123 456 789" required>
        </div>
      </div>

      <div class="form-group">
        <label for="service">Select Service</label>
        <select id="service" name="service" required>
          <option value="" disabled selected>Choose a service...</option>
          <option value="hair-styling">Hair Styling & Care</option>
          <option value="skin-treatment">Skincare Consultation</option>
          <option value="makeup-session">Professional Makeup</option>
          <option value="bridal-package">Bridal Package</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Preferred Date</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
          <label for="time">Preferred Time</label>
          <input type="time" id="time" name="time" required>
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Special Requests / Notes</label>
        <textarea id="notes" name="notes" placeholder="Tell us about your preferences or requirements..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Confirm Booking</button>
    </form>

    <div class="footer-link">
      Already have an account? <a href="/user-login">Sign In</a>
    </div>
  </div>

</body>
</html>
