<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Aura Beauty & Styling</title>
  <style>
    :root {
      --primary-sky: #00b4d8;
      --light-sky: #f0f9ff;
      --dark-blue: #03045e;
      --accent-sky: #caf0f8;
      --text-dark: #1b263b;
      --text-muted: #6c757d;
      --white: #ffffff;
      --border-color: rgba(0, 180, 216, 0.2);
      --shadow: 0 15px 35px rgba(0, 180, 216, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #f0f9ff 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--white);
      width: 100%;
      max-width: 440px;
      padding: 45px 35px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-header .tagline {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.8rem;
      color: var(--primary-sky);
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }

    .brand-header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--dark-blue);
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 16px;
      padding-left: 42px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      background-color: #fafdfe;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-sky);
      background-color: var(--white);
      box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.12);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--primary-sky);
      pointer-events: none;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      accent-color: var(--primary-sky);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-pass {
      color: var(--primary-sky);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .forgot-pass:hover {
      color: var(--dark-blue);
      text-decoration: underline;
    }

    .submit-btn {
      background-color: var(--primary-sky);
      color: var(--white);
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 5px 15px rgba(0, 180, 216, 0.25);
    }

    .submit-btn:hover {
      background-color: #0096c7;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 180, 216, 0.35);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 12px;
    }

    .signup-prompt {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .signup-prompt a {
      color: var(--primary-sky);
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }

    .signup-prompt a:hover {
      color: var(--dark-blue);
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
        border-radius: 16px;
      }

      .brand-header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <span class="tagline">Aura Beauty & Styling</span>
      <h1>Welcome Back</h1>
      <p>Sign in to manage your appointments & wardrobe consults</p>
    </div>

    <form class="login-form" action="#" method="POST">
      <!-- Email / Username Input -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="name@example.com" required />
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-pass">Forgot Password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <div class="divider">
      <span>or</span>
    </div>

    <!-- Sign Up Prompt -->
    <div class="signup-prompt">
      Don't have an account? <a href="#">Book a Consultation</a>
    </div>
  </div>

</body>
</html>
