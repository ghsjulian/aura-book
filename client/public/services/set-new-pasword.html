<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f8ff;
            background-image: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            text-align: center;
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: #f0f9ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon-wrapper svg {
            width: 36px;
            height: 36px;
            stroke: #0284c7;
        }

        h2 {
            color: #0369a1;
            font-size: 1.6rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            color: #0369a1;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-container {
            position: relative;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border: 2px solid #e0f2fe;
            border-radius: 12px;
            font-size: 1rem;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        input[type="password"]:focus, input[type="text"]:focus {
            border-color: #38bdf8;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #0284c7;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
        }

        /* Password Requirements Hints */
        .requirements {
            text-align: left;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
        }

        .requirements-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #0369a1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .requirements ul {
            list-style: none;
        }

        .requirements li {
            font-size: 0.82rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .requirements li:last-child {
            margin-bottom: 0;
        }

        .bullet {
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            display: inline-block;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-submit:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            margin-top: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #0284c7;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #0369a1;
            text-decoration: underline;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-wrapper">
            <!-- Shield Check SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
            </svg>
        </div>

        <h2>Set New Password</h2>
        <p>Your new password must be different from previously used passwords.</p>

        <form action="#" method="POST">
            <!-- New Password Input -->
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="input-container">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="toggleVisibility('password', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Confirm Password Input -->
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-container">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="toggleVisibility('confirm-password', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Password Requirements -->
            <div class="requirements">
                <div class="requirements-title">Password must contain:</div>
                <ul>
                    <li><span class="bullet"></span> At least 8 characters long</li>
                    <li><span class="bullet"></span> At least one uppercase & lowercase letter</li>
                    <li><span class="bullet"></span> At least one number or special symbol</li>
                </ul>
            </div>

            <button type="submit" class="btn-submit">Reset Password</button>
        </form>

        <a href="#" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            Back to Sign In
        </a>
    </div>

    <script>
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.style.color = '#0369a1';
            } else {
                input.type = 'password';
                btn.style.color = '#0284c7';
            }
        }
    </script>
</body>
</html>
