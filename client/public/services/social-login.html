<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Aura Beauty & Styling</title>
  <style>
    :root {
      --primary-sky: #00b4d8;
      --light-sky: #f0f9ff;
      --dark-blue: #03045e;
      --accent-sky: #caf0f8;
      --text-dark: #1b263b;
      --text-muted: #6c757d;
      --white: #ffffff;
      --border-color: rgba(0, 180, 216, 0.2);
      --shadow: 0 15px 35px rgba(0, 180, 216, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #f0f9ff 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--white);
      width: 100%;
      max-width: 440px;
      padding: 45px 35px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-header .tagline {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.8rem;
      color: var(--primary-sky);
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }

    .brand-header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--dark-blue);
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Social Login Buttons */
    .social-login-group {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: var(--white);
      color: var(--text-dark);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25 ease;
    }

    .social-btn:hover {
      background-color: var(--light-sky);
      border-color: var(--primary-sky);
      transform: translateY(-2px);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 12px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      background-color: #fafdfe;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-sky);
      background-color: var(--white);
      box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.12);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--primary-sky);
      pointer-events: none;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      accent-color: var(--primary-sky);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-pass {
      color: var(--primary-sky);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .forgot-pass:hover {
      color: var(--dark-blue);
      text-decoration: underline;
    }

    .submit-btn {
      background-color: var(--primary-sky);
      color: var(--white);
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 5px;
      box-shadow: 0 5px 15px rgba(0, 180, 216, 0.25);
    }

    .submit-btn:hover {
      background-color: #0096c7;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 180, 216, 0.35);
    }

    .signup-prompt {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 25px;
    }

    .signup-prompt a {
      color: var(--primary-sky);
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }

    .signup-prompt a:hover {
      color: var(--dark-blue);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .social-login-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <span class="tagline">Aura Beauty & Styling</span>
      <h1>Welcome Back</h1>
      <p>Sign in to manage your appointments & wardrobe consults</p>
    </div>

    <!-- Social Login Buttons -->
    <div class="social-login-group">
      <!-- Google -->
      <a href="#" class="social-btn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google</span>
      </a>

      <!-- GitHub -->
      <a href="#" class="social-btn">
        <svg viewBox="0 0 24 24" fill="#181717">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>

    <div class="divider">
      <span>or email login</span>
    </div>

    <form class="login-form" action="#" method="POST">
      <!-- Email Input -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="name@example.com" required />
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-pass">Forgot Password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <div class="signup-prompt">
      Don't have an account? <a href="#">Book a Consultation</a>
    </div>
  </div>

</body>
</html>
